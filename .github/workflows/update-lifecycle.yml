name: Studio update lifecycle
on: [push, pull_request]
jobs:
  windows-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest cryptography psutil
      - name: 更新事务、正常退出部署与健康握手回归
        run: python -m pytest tests/test_signed_updater.py tests/test_launcher_updates.py tests/test_update_lifecycle.py -k "not preflight_imports_actual_candidate" -q
